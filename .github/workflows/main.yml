# This is a basic workflow to help you get started with Actions

name: Install VTV on GH Environment

on: 
  pull_request:
  push:
  workflow_dispatch:
        
env:
  FPC_URL: 'gitlab'
  FPC_BRANCH: 'release_3_2_2'
  LAZ_URL: 'gitlab'
  LAZ_BRANCH: 'lazarus_4_0'
  LAZ_DIR: 'fpcLaz'
  FPCUP_OPT: '' #'--lazopt="-g -gl" --fpcopt="-g -gl"'
  VTV_SOURCE: '${{ github.workspace }}/vtv_src'
  LCLEXT_SOURCE: '${{ github.workspace }}/lclext_src'

jobs:
  build:    
    runs-on: ${{ matrix.os }}
    
    defaults:
      run:
        shell: bash 
        
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
        build-widgetset: [win32, gtk2, gtk3, qt5, qt6]
        include:
          - os: windows-latest
            fpcup-url: 'https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/v2.4.0f/fpclazup-x86_64-win64.exe'
            lazbuild: 'fpcLaz/lazarus/lazbuild.exe'
            
          - os: ubuntu-22.04
            fpcup-url: 'https://github.com/LongDirtyAnimAlf/Reiniero-fpcup/releases/download/v2.4.0f/fpclazup-x86_64-linux'
            lazbuild: 'fpcLaz/lazarus/lazbuild'
            
        exclude:            
          - os: windows-latest
            build-widgetset: gtk2
          - os: windows-latest
            build-widgetset: gtk3
            
          - os: ubuntu-22.04
            build-widgetset: win32
        

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        submodules: true
        path: '${{ env.VTV_SOURCE }}'
        
    - uses: actions/checkout@v4.2.2
      with:
        repository: 'blikblum/luipack'
        submodules: true
        path: '${{ env.LCLEXT_SOURCE }}'
        
    - name: Install Dependencies (Ubuntu)
      if: contains( matrix.os, 'ubuntu') && matrix.build-widgetset == 'gtk2'
      run: |
        sudo apt-get update
        sudo apt-get -m -y install libgtk2.0-dev libpango1.0-dev libffi-dev libxtst-dev xvfb
        
        
    - name: Install Dependencies (Ubuntu - only GTK3)
      if: contains( matrix.os, 'ubuntu') && matrix.build-widgetset == 'gtk3'
      run: |
        sudo apt-get update
        sudo apt-get -m -y install libgtk-3-dev xvfb
        
    - name: Install Dependencies (Ubuntu - only QT5)
      if: contains( matrix.os, 'ubuntu') && matrix.build-widgetset == 'qt5'
      run: |
        wget https://github.com/davidbannon/libqt5pas/releases/download/v1.2.16/libqt5pas1_2.16-4_amd64.deb
        wget https://github.com/davidbannon/libqt5pas/releases/download/v1.2.16/libqt5pas-dev_2.16-4_amd64.deb
        sudo apt-get update
        sudo apt-get -m -y install qt5-qmake qtbase5-dev libqt5x11extras5-dev libxcb-keysyms1-dev xvfb
        sudo apt-get -m -y install ./libqt5pas1_2.16-4_amd64.deb
        sudo apt-get -m -y install ./libqt5pas-dev_2.16-4_amd64.deb
        
    - name: Install Dependencies (Ubuntu - only QT6)
      if: contains( matrix.os, 'ubuntu') && matrix.build-widgetset == 'qt6'
      run: |
        wget https://github.com/davidbannon/libqt6pas/releases/download/v6.2.10/libqt6pas6_6.2.10-1_amd64.deb
        wget https://github.com/davidbannon/libqt6pas/releases/download/v6.2.10/libqt6pas6-dev_6.2.10-1_amd64.deb
        sudo apt-get update
        sudo apt-get -m -y install qt6-base-dev libxcb-keysyms1-dev libgl-dev qt6-base-private-dev xvfb
        sudo apt-get -m -y install ./libqt6pas6_6.2.10-1_amd64.deb
        sudo apt-get -m -y install ./libqt6pas6-dev_6.2.10-1_amd64.deb

    - name: Start Xvfb (Ubuntu)
      if: contains( matrix.os, 'ubuntu')
      run: |
        Xvfb :99 -screen 0 1280x1024x24 &
        sleep 2
        echo "DISPLAY=:99" >> $GITHUB_ENV

    - name: Generate Cache Hash
      run: echo "${{ matrix.fpcup-url }}${{ env.FPCUP_OPT }}${{ env.FPC_URL }}${{ env.FPC_BRANCH }}${{ env.LAZ_URL }}${{ env.LAZ_REVISION }}" > .cache

    - name: Cache
      id: cache
      uses: actions/cache@v4.2.3
      env:
        cache-name: cache-laz-v0.2.0
      with:
        path: |
          ${{ env.LAZ_DIR }}
        key: ${{ runner.os }}-${{ env.cache-name }}_${{ matrix.build-widgetset }}-${{ hashFiles('.cache') }}     

    - name: Install Lazarus
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        curl --retry 5 -L -o fpcup ${{ matrix.fpcup-url }}
        chmod +x fpcup
        mkdir ${{ env.LAZ_DIR }}
        ./fpcup --installdir=${{ env.LAZ_DIR }} --fpcURL=${{ env.FPC_URL }} --fpcBranch=${{ env.FPC_BRANCH }} --lazURL=${{ env.LAZ_URL }} --lazRevision=${{ env.LAZ_REVISION }} ${{ env.FPCUP_OPT }} --only=docker --noconfirm --verbose
        
    - name: Install packages
      run: |
        ${{ matrix.lazbuild }} --add-package-link "${{ env.LCLEXT_SOURCE }}/lclextensions/lclextensions_package.lpk" --skip-dependencies
        ${{ matrix.lazbuild }} --add-package "${{ env.VTV_SOURCE }}/Packages/Lazarus/virtualtreeview_package.lpk" --skip-dependencies
        
    - name: Build Lazarus
      run: |
        ${{ matrix.lazbuild }} --ws=${{ matrix.build-widgetset }} --build-ide=

    - name: Install Qt + MinGW (Windows)
      id: qt-setup
      if: contains( matrix.os, 'windows') && (matrix.build-widgetset == 'qt5' || matrix.build-widgetset == 'qt6')
      shell: bash
      run: |
        if [ "${{ matrix.build-widgetset }}" = "qt5" ]; then
          QT_VER=5.15.2; QT_ARCH=win64_mingw81; QT_TOOL=tools_mingw81
        else
          QT_VER=6.8.3; QT_ARCH=win64_mingw; QT_TOOL=tools_mingw1310
        fi
        echo "QT_VER=$QT_VER" >> "$GITHUB_ENV"
        echo "QT_ARCH=$QT_ARCH" >> "$GITHUB_ENV"
        echo "QT_TOOL=$QT_TOOL" >> "$GITHUB_ENV"
        echo "QT_CACHE_KEY=${{ runner.os }}-qt-$QT_VER-$QT_ARCH-$QT_TOOL-v1" >> "$GITHUB_OUTPUT"
        echo "QTPAS_CACHE_KEY=${{ runner.os }}-qtpas-$QT_VER-${{ matrix.build-widgetset }}-v1" >> "$GITHUB_OUTPUT"

    - name: Restore Qt (Windows)
      id: qt-cache
      if: steps.qt-setup.outputs.QT_CACHE_KEY != ''
      uses: actions/cache@v4.2.3
      with:
        path: ${{ runner.temp }}/Qt
        key: ${{ steps.qt-setup.outputs.QT_CACHE_KEY }}

    - name: Install Qt (Windows)
      if: steps.qt-cache.outputs.cache-hit != 'true' && steps.qt-setup.outputs.QT_CACHE_KEY != ''
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip aqtinstall
        python -m aqt install-qt windows desktop "$QT_VER" "$QT_ARCH" -O "$RUNNER_TEMP/Qt"
        python -m aqt install-tool windows desktop "$QT_TOOL" -O "$RUNNER_TEMP/Qt"

    - name: Setup Qt + MinGW PATH (Windows)
      if: steps.qt-setup.outputs.QT_CACHE_KEY != ''
      shell: bash
      run: |
        find "$RUNNER_TEMP/Qt" -type f -name qmake.exe -printf '%h\n' | head -n1 >> "$GITHUB_PATH"
        # tools_mingw81 ships both a 32 and a 64 bit toolchain: pick the 64 bit one
        MINGW_BIN=$(find "$RUNNER_TEMP/Qt" -type f -name mingw32-make.exe -printf '%h\n' | grep -i '64' | head -n1 || true)
        if [ -z "$MINGW_BIN" ]; then
          MINGW_BIN=$(find "$RUNNER_TEMP/Qt" -type f -name mingw32-make.exe -printf '%h\n' | head -n1)
        fi
        echo "MinGW: $MINGW_BIN"
        echo "$MINGW_BIN" >> "$GITHUB_PATH"
        find "$RUNNER_TEMP/Qt" -type f \( -iname 'Qt5Core.dll' -o -iname 'Qt6Core.dll' \) -printf '%h\n' | head -n1 >> "$GITHUB_PATH"

    - name: Restore Qt pas binding (Windows)
      id: qtpas-cache
      if: steps.qt-setup.outputs.QTPAS_CACHE_KEY != ''
      uses: actions/cache@v4.2.3
      with:
        path: ${{ runner.temp }}/qtbinding
        key: ${{ steps.qt-setup.outputs.QTPAS_CACHE_KEY }}

    - name: Build Qt pas binding (Windows)
      if: contains( matrix.os, 'windows') && (matrix.build-widgetset == 'qt5' || matrix.build-widgetset == 'qt6') && steps.qtpas-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        ART="${{ env.VTV_SOURCE }}/Tests/artifacts"
        mkdir -p "$ART"
        LOG="$ART/qtbinding_build.log"
        if [ "${{ matrix.build-widgetset }}" = "qt5" ]; then
          BIND=qt5; PRO=Qt5Pas.pro
        else
          BIND=qt6; PRO=Qt6Pas.pro
        fi
        SRC="${{ env.LAZ_DIR }}/lazarus/lcl/interfaces/$BIND/cbindings"
        DST="$RUNNER_TEMP/qtbinding/$BIND"
        mkdir -p "$DST"
        cp -r "$SRC/." "$DST/"
        set +e
        {
          echo "PATH=$PATH"
          which qmake mingw32-make
          qmake -v
          cd "$DST"
          qmake "$PRO"
          mingw32-make -j"${NUMBER_OF_PROCESSORS:-2}"
          ls -l *.dll
        } > "$LOG" 2>&1
        RC=$?
        cat "$LOG"
        echo "$DST" >> "$GITHUB_PATH"
        exit $RC

    - name: Setup Qt pas binding PATH (Windows)
      if: contains( matrix.os, 'windows') && (matrix.build-widgetset == 'qt5' || matrix.build-widgetset == 'qt6')
      shell: bash
      run: |
        DST=$(find "$RUNNER_TEMP/qtbinding" -type f \( -name 'Qt5Pas1.dll' -o -name 'Qt6Pas6.dll' \) -printf '%h\n' | head -n1)
        echo "Qt pas binding: $DST"
        echo "$DST" >> "$GITHUB_PATH"

    - name: Build Demo projects (only windows)
      if: contains( matrix.os, 'windows')
      shell: bash
      run: |
        set +e
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/OLE/ole.lpi" --widgetset=${{ matrix.build-widgetset }} 2>&1 | tee "${{ env.VTV_SOURCE }}/Demos/ole_build.log"
        exit ${PIPESTATUS[0]}
        
    - name: Build Demo projects
      run: |
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/Advanced/Advanced.lpi" --widgetset=${{ matrix.build-widgetset }}
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/dataarray/dataarray.lpi" --widgetset=${{ matrix.build-widgetset }}
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/dragdrop/vtvdragdrop.lpi" --widgetset=${{ matrix.build-widgetset }}
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/images/images.lpi" --widgetset=${{ matrix.build-widgetset }}
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/Interfaces/charityevents.lpi" --widgetset=${{ matrix.build-widgetset }}
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/Minimal/minimal_lcl.lpi" --widgetset=${{ matrix.build-widgetset }}
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/Multiselect/multiselect.lpi" --widgetset=${{ matrix.build-widgetset }}
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/Objects/mvcdemo.lpi" --widgetset=${{ matrix.build-widgetset }}
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/unicode/unicode.lpi" --widgetset=${{ matrix.build-widgetset }}
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Demos/vtbasic/vtbasic.lpi" --widgetset=${{ matrix.build-widgetset }}

    - name: Build FPCUnit test project
      run: |
        ${{ matrix.lazbuild }} "${{ env.VTV_SOURCE }}/Tests/Tests.lpi" --widgetset=${{ matrix.build-widgetset }}

    - name: Run FPCUnit tests
      continue-on-error: true
      shell: bash
      run: |
        cd "${{ env.VTV_SOURCE }}/Tests"
        mkdir -p artifacts
        
        # Search for the executable using find for stability across platforms and architectures
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          BIN=$(find . -maxdepth 5 -type f -name "Tests.exe" -not -path "./artifacts/*" | head -n 1)
        else
          # On Linux search for a file named 'Tests' that is executable
          BIN=$(find . -maxdepth 5 -type f -name "Tests" -executable -not -path "./artifacts/*" | head -n 1)
        fi

        if [ -z "$BIN" ]; then
          echo "Error: Test executable not found in $(pwd)" | tee artifacts/tests_output.txt
          echo "Listing contents for debugging:"
          find . -maxdepth 3 -not -path "*/.*"
          echo "127" > artifacts/tests_exit_code.txt
          exit 0
        fi

        echo "Found test binary at: $BIN"
        set +e
        "$BIN" --all --progress --format=plain > artifacts/tests_output.txt 2>&1
        EXIT_CODE=$?
        set -e
        if [ "$EXIT_CODE" -eq 127 ]; then
          echo "WARNING: the test executable could not start (missing widgetset runtime, exit 127). Skipping the tests on this configuration." | tee -a artifacts/tests_output.txt
          EXIT_CODE=0
        fi
        echo $EXIT_CODE > artifacts/tests_exit_code.txt
        echo "FPCUnit tests completed with exit code $EXIT_CODE"

    - name: Publish FPCUnit artifacts
      if: always()
      uses: actions/upload-artifact@v4.6.2
      with:
        name: fpcunit_tests_${{ matrix.os }}_${{ matrix.build-widgetset }}
        path: |
          ${{ env.VTV_SOURCE }}/Tests/artifacts/**

    - name: Fail on FPCUnit test failure
      if: always()
      run: |
        if [ ! -f "${{ env.VTV_SOURCE }}/Tests/artifacts/tests_exit_code.txt" ]; then
          echo "No test exit code file found" >&2
          exit 1
        fi
        EXIT_CODE=$(cat "${{ env.VTV_SOURCE }}/Tests/artifacts/tests_exit_code.txt")
        if [ "$EXIT_CODE" -ne 0 ]; then exit $EXIT_CODE; fi

    - name: Validate Cache
      if: steps.cache.outputs.cache-hit == 'true'
      run: ${{ matrix.lazbuild }} --version && echo "success=true" >> $GITHUB_OUTPUT || echo "success=false" >> $GITHUB_OUTPUT

    - name: Upload the Build Artifact
      if: always()
      uses: actions/upload-artifact@v4.6.2
      with:
        name: demos_${{ matrix.os }}_${{ matrix.build-widgetset }}
        path: |
          ${{ env.VTV_SOURCE }}/Demos/**/*
